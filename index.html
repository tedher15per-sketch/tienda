<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17694a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Mostrador Abarrotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de mostrador — barra superior tipo rótulo, navegación lateral en escritorio y abajo en celular; listas operables, tickets en papel térmico */
:root{
  --bg:#edf3f0; --surface:#ffffff; --surface-2:#e1ebe6; --ink:#13221c; --muted:#56695f; --line:#c9d8d0;
  --bar:#17694a; --green:#17694a; --green-soft:#d3e9de; --accent:#d1236b; --accent-soft:#f8dbe7; --on-accent:#ffffff;
  --ok:#1b7a4c; --warn:#a36200; --bad:#bf3427; --warn-soft:#fbecd2; --bad-soft:#f8dcd8; --ok-soft:#d6efe1;
  --paper:#fbfbf7; --shadow:0 10px 30px rgba(19,34,28,.12);
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --nav-h:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1714; --surface:#15211d; --surface-2:#1c2b26; --ink:#e4efea; --muted:#94aaa0; --line:#2a3c35;
  --bar:#123b2d; --green:#4fc394; --green-soft:#1d3a2f; --accent:#ff5d9c; --accent-soft:#45192c; --on-accent:#1a0710;
  --ok:#5bd29a; --warn:#f0ae47; --bad:#ff7a6a; --warn-soft:#3b2b10; --bad-soft:#3d1a16; --ok-soft:#173a2a;
  --paper:#1b2622; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1714; --surface:#15211d; --surface-2:#1c2b26; --ink:#e4efea; --muted:#94aaa0; --line:#2a3c35;
  --bar:#123b2d; --green:#4fc394; --green-soft:#1d3a2f; --accent:#ff5d9c; --accent-soft:#45192c; --on-accent:#1a0710;
  --ok:#5bd29a; --warn:#f0ae47; --bad:#ff7a6a; --warn-soft:#3b2b10; --bad-soft:#3d1a16; --ok-soft:#173a2a;
  --paper:#1b2622; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h2,h3{margin:0;text-wrap:balance}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.awning{width:38px;height:38px;border-radius:10px;flex:none;background:repeating-linear-gradient(90deg,#fff 0 7px,var(--accent) 7px 14px);box-shadow:inset 0 -9px 0 rgba(0,0,0,.18)}
.top .name{font-family:var(--f-display);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.chip-role{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn-scan{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;white-space:nowrap}
@media (max-width:520px){.btn-scan .lbl{display:none}.top .sub{display:none}}

/* estructura */
.shell{display:grid;grid-template-columns:1fr;min-height:calc(100% - 58px)}
nav.side{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.side button{flex:1 0 68px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:9px 6px 8px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
nav.side button[aria-current="page"]{color:var(--green)}
nav.side button[aria-current="page"]::after{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.side .badge{position:absolute;top:5px;right:calc(50% - 22px);background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:10px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center}
main{padding-block:18px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%;margin:0 auto}
@media (min-width:900px){
  .shell{grid-template-columns:210px 1fr}
  nav.side{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 58px);flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 10px;gap:4px;overflow:visible}
  nav.side button{flex:none;flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;border-radius:10px;justify-content:flex-start}
  nav.side button:hover{background:var(--surface-2)}
  nav.side button[aria-current="page"]{background:var(--green-soft)}
  nav.side button[aria-current="page"]::after{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  nav.side .badge{position:static;margin-left:auto}
  main{padding-bottom:40px}
}

/* piezas */
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head h1{font-size:34px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.panel > h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
button.kpi{border:1px solid var(--line)}
button.kpi:hover{border-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:10px 15px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);min-height:42px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.hot{background:var(--accent-soft);color:var(--accent)} .pill.green{background:var(--green-soft);color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12.5px;font-weight:700;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:44px}
.input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px var(--green-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:480px){.form-grid{grid-template-columns:1fr}}
.searchbar{display:flex;gap:8px;align-items:center}
.searchbar .wrap{position:relative;flex:1;min-width:0}
.searchbar .wrap .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.searchbar .wrap input{padding-left:40px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:21px}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--green-soft);color:var(--green)}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);min-width:0;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:44px;height:44px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:var(--green);overflow:hidden}
.thumb.big{width:96px;height:96px;font-size:44px;border-radius:16px}
.inv-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center}
@media (max-width:560px){.inv-row{grid-template-columns:44px minmax(0,1fr) auto}.inv-row .price{display:none}}

/* POS */
.pos{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:1050px){.pos{grid-template-columns:minmax(0,1fr) 360px}.pos aside{position:sticky;top:80px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:104px;min-width:0}
.tile:hover{border-color:var(--green)}
.tile .n{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .p{font-family:var(--f-mono);font-weight:600;margin-top:auto}
.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cart-line .qty{display:flex;align-items:center;gap:6px}
.cart-line .qty button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.cart-line .qty .ic{width:16px;height:16px}
.totline{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.totline b{font-family:var(--f-display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums}
.paybar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:15;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.paybar .btn{width:100%;min-height:52px;font-size:16px;box-shadow:var(--shadow)}
@media (min-width:900px){.paybar{left:210px;bottom:0}}
@media (min-width:1050px){.paybar.pos-bar{display:none}}

/* tienda cliente */
.shop-hero{border-radius:20px;padding:22px;background:var(--green);color:var(--bg);position:relative;overflow:hidden}
.shop-hero::before{content:"";position:absolute;inset:0 0 auto;height:16px;background:repeating-linear-gradient(90deg,var(--accent) 0 26px,var(--paper) 26px 52px);opacity:.95}
.shop-hero h1{font-size:clamp(30px,6vw,46px);margin-top:10px}
.shop-hero p{margin:6px 0 0;max-width:46ch;opacity:.9}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .img{aspect-ratio:4/3;max-width:100%;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-size:42px;color:var(--green);overflow:hidden}
.pcard .img img{width:100%;height:100%;object-fit:cover}
.pcard .n{font-weight:600;font-size:14px;line-height:1.25;min-height:2.5em}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1.5px solid var(--green);border-radius:11px;padding:3px}
.stepper button{width:34px;height:34px;border:0;border-radius:8px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.track i{height:6px;border-radius:3px;background:var(--surface-2)}
.track i.on{background:var(--green)}
.track-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted);font-weight:600}

/* pedidos */
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ocard .items{font-size:13.5px;color:var(--muted);margin:0;padding-left:18px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.status-nuevo{border-left:5px solid var(--accent)} .status-preparando{border-left:5px solid var(--warn)} .status-listo{border-left:5px solid var(--green)}

/* ticket térmico */
.ticket{background:var(--paper);color:var(--ink);font-family:var(--f-mono);font-size:13px;padding:20px 18px 26px;border-radius:4px;position:relative;
  -webkit-mask:radial-gradient(8px at 50% 100%,#0000 98%,#000) 50% 100%/16px 100% repeat-x;mask:radial-gradient(8px at 50% 100%,#0000 98%,#000) 50% 100%/16px 100% repeat-x;border:1px solid var(--line)}
.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed var(--muted);margin:10px 0}
.ticket .l{display:flex;justify-content:space-between;gap:10px}
.ticket .big{font-size:18px;font-weight:600}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,16,13,.55);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding-block:8px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
@media (min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:22px;max-height:88%;padding-bottom:22px}}
.sheet-head{position:sticky;top:-8px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 12px;z-index:2}
.sheet-head h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
@media (min-width:700px){.grabber{display:none}}
.scan-drop{position:relative;display:grid;place-items:center;gap:8px;text-align:center;border:2px dashed var(--green);border-radius:18px;padding:26px 16px;background:var(--green-soft);color:var(--green);cursor:pointer;font-weight:700}
.scan-drop .ic{width:44px;height:44px}
.scan-drop input{position:absolute;width:1px;height:1px;opacity:0}
.laser{height:3px;width:70%;background:var(--accent);border-radius:2px;box-shadow:0 0 12px var(--accent);animation:laser 1.6s ease-in-out infinite}
@keyframes laser{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);font-size:14px;text-align:center}
#toast div.bad{background:var(--bad);color:#fff}
@media (min-width:900px){#toast{bottom:28px}}
.chart svg{width:100%;height:auto;display:block}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bar-row .b{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-row .b i{display:block;height:100%;background:var(--green)}
.bignum{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.loading{padding:60px 10px;text-align:center;color:var(--muted)}
.reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:220px}
.reader video{width:100%!important;object-fit:cover;display:block}
#qr-work{position:absolute;left:-9999px;top:0;width:300px;height:300px}
pre.copytext{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;user-select:all}
</style>

</head>
<body>
<header class="top">
  <div class="brand">
    <div class="awning" aria-hidden="true"></div>
    <div style="min-width:0">
      <div class="sub">Abarrotes · Mostrador</div>
      <div class="name" id="storeName">Mi Tiendita</div>
    </div>
  </div>
  <button class="chip-role" id="roleChip" type="button">Abriendo…</button>
  <button class="btn-scan" id="scanBtn" type="button"><span class="ic" data-ic="scan"></span><span class="lbl">Escanear</span></button>
</header>
